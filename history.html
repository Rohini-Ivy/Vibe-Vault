<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VibeVault - History</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 pb-28 text-white">


    <header class="border-b border-slate-800 bg-slate-950/95">

        <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-5">

            <a
                href="index.html"
                class="text-2xl font-bold tracking-tight">
                🎵 Vibe<span class="text-purple-500">Vault</span>
            </a>


            <nav class="flex items-center gap-2">

                <a
                    href="favorites.html"
                    class="rounded-xl px-3 py-2 text-sm text-slate-300 transition hover:bg-slate-800 hover:text-white">
                    ❤️ Favorites
                </a>

                <a
                    href="history.html"
                    class="rounded-xl bg-purple-600/20 px-3 py-2 text-sm text-purple-400">
                    🕘 History
                </a>

            </nav>

        </div>

    </header>


    <main class="mx-auto max-w-4xl px-4 py-12">


        <a
            href="index.html"
            class="inline-flex items-center gap-2 text-sm text-slate-400 transition hover:text-white">
            ← Back to Discover
        </a>


        <div class="mt-8 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">

            <div>

                <h1 class="text-3xl font-bold">
                    🕘 Listening History
                </h1>

                <p class="mt-2 text-sm text-slate-400">
                    Your recently played songs.
                </p>

            </div>


            <button
                id="clearHistoryButton"
                class="rounded-xl border border-red-900/50 px-4 py-2 text-sm text-red-400 transition hover:bg-red-950/40">
                Clear History
            </button>

        </div>


        <div
            id="historyContainer"
            class="mt-8 space-y-3">
        </div>


        <div
            id="emptyHistory"
            class="mt-12 hidden rounded-2xl border border-dashed border-slate-700 bg-slate-900/50 px-6 py-16 text-center">

            <div class="text-5xl">
                🎧
            </div>

            <h2 class="mt-5 text-xl font-semibold">
                No listening history
            </h2>

            <p class="mx-auto mt-2 max-w-md text-sm text-slate-400">
                Songs you play will appear here automatically.
            </p>

            <a
                href="index.html"
                class="mt-6 inline-block rounded-xl bg-purple-600 px-5 py-3 text-sm font-medium transition hover:bg-purple-500">
                Discover Music
            </a>

        </div>

    </main>


    <div
        id="musicPlayer"
        class="fixed bottom-0 left-0 right-0 z-50 hidden border-t border-slate-800 bg-slate-950/95 backdrop-blur-lg">

        <div class="mx-auto max-w-7xl px-4 py-3">

            <div class="flex items-center gap-3 sm:gap-4">

                <img
                    id="playerArtwork"
                    src=""
                    alt="Album artwork"
                    class="hidden h-14 w-14 rounded-lg object-cover sm:block"
                >


                <div class="min-w-0 w-32 sm:w-56">

                    <h4
                        id="playerTitle"
                        class="truncate font-semibold">
                        No song playing
                    </h4>

                    <p
                        id="playerArtist"
                        class="truncate text-sm text-slate-400">
                        Select a song to play
                    </p>

                </div>


                <div class="flex items-center gap-1 sm:gap-2">

                    <button
                        id="previousButton"
                        class="rounded-full p-2 text-slate-300 transition hover:bg-slate-800">
                        ⏮
                    </button>

                    <button
                        id="playPauseButton"
                        class="flex h-10 w-10 items-center justify-center rounded-full bg-purple-600 transition hover:bg-purple-500">
                        ▶
                    </button>

                    <button
                        id="nextButton"
                        class="rounded-full p-2 text-slate-300 transition hover:bg-slate-800">
                        ⏭
                    </button>

                </div>


                <div class="hidden flex-1 items-center gap-3 md:flex">

                    <span
                        id="currentTime"
                        class="text-xs text-slate-400">
                        0:00
                    </span>

                    <input
                        id="progressBar"
                        type="range"
                        min="0"
                        max="100"
                        value="0"
                        class="w-full accent-purple-500"
                    >

                    <span
                        id="duration"
                        class="text-xs text-slate-400">
                        0:00
                    </span>

                </div>


                <button
                    id="volumeButton"
                    class="hidden rounded-full p-2 text-slate-300 transition hover:bg-slate-800 sm:block">
                    🔊
                </button>

            </div>


            <audio id="audioPlayer"></audio>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
